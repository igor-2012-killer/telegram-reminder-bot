name: Bug Report
description: File a report to help us improve
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report!
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Also tell us, what did you expect to happen?
          placeholder: Tell us what you see!
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: How to reproduce?
          description: Provide steps to reproduce the issue.
          placeholder: 1. Send /start...
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs
          description: Please provide relevant logs if applicable.
