services:
  bot:
    build: .
    restart: always
    environment:
      - DATABASE_URL=file:./prisma/dev.db
      - BOT_TOKEN=${BOT_TOKEN}
      - NODE_ENV=production
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dist/index.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
